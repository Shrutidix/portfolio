<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" fill="none">
  <!-- Hand-drawn notebook sketch background -->
  <rect width="500" height="350" rx="14" fill="#FAF6EF" stroke="#E0D4C3" stroke-width="1.5"/>
  
  <!-- Subtle graph paper grid lines -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAE0D2" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="500" height="350" rx="14" fill="url(#grid)"/>

  <!-- Title annotation -->
  <text x="25" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#3F6253" letter-spacing="1">SCHEMA // DIMENSIONAL MODEL (STAR)</text>

  <!-- Central Fact Table: Fact_Sales -->
  <rect x="180" y="125" width="140" height="100" rx="8" fill="#222B31" stroke="#323E45" stroke-width="1.5"/>
  <rect x="180" y="125" width="140" height="24" rx="8" fill="#323E45"/>
  <text x="250" y="141" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FAF6EF" text-anchor="middle">Fact_Sales</text>
  <text x="192" y="166" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22D3EE">[PK] Transaction_ID</text>
  <text x="192" y="180" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D9C3A3">[FK] Customer_Key</text>
  <text x="192" y="194" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D9C3A3">[FK] Product_Key</text>
  <text x="192" y="208" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E9387">Sales_Amount (DAX)</text>

  <!-- Dimension 1: Dim_Customer (Top Left) -->
  <rect x="35" y="45" width="115" height="75" rx="6" fill="#FAF6EF" stroke="#3F6253" stroke-width="1.5"/>
  <rect x="35" y="45" width="115" height="20" rx="6" fill="#3F6253"/>
  <text x="92.5" y="59" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FAF6EF" text-anchor="middle">Dim_Customer</text>
  <text x="43" y="80" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#222B31">[PK] Customer_Key</text>
  <text x="43" y="93" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Name / Region</text>
  <text x="43" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Loyalty_Tier</text>

  <!-- Dimension 2: Dim_Product (Top Right) -->
  <rect x="350" y="45" width="115" height="75" rx="6" fill="#FAF6EF" stroke="#3F6253" stroke-width="1.5"/>
  <rect x="350" y="45" width="115" height="20" rx="6" fill="#3F6253"/>
  <text x="407.5" y="59" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FAF6EF" text-anchor="middle">Dim_Product</text>
  <text x="358" y="80" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#222B31">[PK] Product_Key</text>
  <text x="358" y="93" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Category_Desc</text>
  <text x="358" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Unit_Cost / Price</text>

  <!-- Dimension 3: Dim_Date (Bottom Left) -->
  <rect x="35" y="235" width="115" height="75" rx="6" fill="#FAF6EF" stroke="#3F6253" stroke-width="1.5"/>
  <rect x="35" y="235" width="115" height="20" rx="6" fill="#3F6253"/>
  <text x="92.5" y="249" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FAF6EF" text-anchor="middle">Dim_Date</text>
  <text x="43" y="270" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#222B31">[PK] Date_Key</text>
  <text x="43" y="283" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Quarter / Month</text>
  <text x="43" y="296" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Fiscal_Year</text>

  <!-- Dimension 4: Dim_Store (Bottom Right) -->
  <rect x="350" y="235" width="115" height="75" rx="6" fill="#FAF6EF" stroke="#3F6253" stroke-width="1.5"/>
  <rect x="350" y="235" width="115" height="20" rx="6" fill="#3F6253"/>
  <text x="407.5" y="249" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FAF6EF" text-anchor="middle">Dim_Store</text>
  <text x="358" y="270" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#222B31">[PK] Store_Key</text>
  <text x="358" y="283" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Store_Location</text>
  <text x="358" y="296" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#53453E">Country_Code</text>

  <!-- Hand-drawn style connecting lines (1-to-many relationship) -->
  <!-- Dim_Customer to Fact -->
  <path d="M 150 90 Q 165 145 180 155" stroke="#7E9387" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="150" cy="90" r="3" fill="#3F6253"/>
  <circle cx="180" cy="155" r="3" fill="#222B31"/>
  <text x="156" y="125" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7E9387">1:∞</text>

  <!-- Dim_Product to Fact -->
  <path d="M 350 90 Q 335 145 320 155" stroke="#7E9387" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="350" cy="90" r="3" fill="#3F6253"/>
  <circle cx="320" cy="155" r="3" fill="#222B31"/>
  <text x="334" y="125" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7E9387">1:∞</text>

  <!-- Dim_Date to Fact -->
  <path d="M 150 260 Q 165 205 180 195" stroke="#7E9387" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="150" cy="260" r="3" fill="#3F6253"/>
  <circle cx="180" cy="195" r="3" fill="#222B31"/>
  <text x="156" y="235" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7E9387">1:∞</text>

  <!-- Dim_Store to Fact -->
  <path d="M 350 260 Q 335 205 320 195" stroke="#7E9387" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="350" cy="260" r="3" fill="#3F6253"/>
  <circle cx="320" cy="195" r="3" fill="#222B31"/>
  <text x="334" y="235" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7E9387">1:∞</text>

  <!-- Hand-drawn note at bottom -->
  <text x="250" y="332" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="13" fill="#6E5C53" text-anchor="middle">
    * Optimized for DAX filter propagation and analytical query speed
  </text>
</svg>
