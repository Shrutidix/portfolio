<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%" height="60" fill="none">
  <!-- Network Graph Connecting Edges -->
  <g stroke="#7E9387" stroke-width="1" stroke-opacity="0.6">
    <line x1="50" y1="30" x2="120" y2="18"/>
    <line x1="50" y1="30" x2="100" y2="44"/>
    <line x1="120" y1="18" x2="180" y2="32"/>
    <line x1="100" y1="44" x2="180" y2="32"/>
    <line x1="180" y1="32" x2="240" y2="15"/>
    <line x1="180" y1="32" x2="260" y2="42"/>
    <line x1="240" y1="15" x2="300" y2="28"/>
    <line x1="260" y1="42" x2="300" y2="28"/>
    
    <!-- Central hub connections -->
    <line x1="300" y1="28" x2="360" y2="15"/>
    <line x1="300" y1="28" x2="380" y2="42"/>
    <line x1="360" y1="15" x2="440" y2="28"/>
    <line x1="380" y1="42" x2="440" y2="28"/>
    <line x1="440" y1="28" x2="510" y2="18"/>
    <line x1="440" y1="28" x2="490" y2="44"/>
    <line x1="510" y1="18" x2="560" y2="30"/>
    <line x1="490" y1="44" x2="560" y2="30"/>
  </g>

  <!-- Network Graph Vertices / Nodes -->
  <g stroke="#FAF6EF" stroke-width="1.5">
    <circle cx="50" cy="30" r="4" fill="#3F6253"/>
    <circle cx="120" cy="18" r="3.5" fill="#7E9387"/>
    <circle cx="100" cy="44" r="3" fill="#D9C3A3"/>
    <circle cx="180" cy="32" r="5" fill="#222B31"/>
    <circle cx="240" cy="15" r="3.5" fill="#7E9387"/>
    <circle cx="260" cy="42" r="4" fill="#3F6253"/>
    <circle cx="300" cy="28" r="6" fill="#22D3EE"/>
    <circle cx="360" cy="15" r="4" fill="#7E9387"/>
    <circle cx="380" cy="42" r="3.5" fill="#D9C3A3"/>
    <circle cx="440" cy="28" r="5" fill="#222B31"/>
    <circle cx="510" cy="18" r="3.5" fill="#7E9387"/>
    <circle cx="490" cy="44" r="3" fill="#D9C3A3"/>
    <circle cx="560" cy="30" r="4" fill="#3F6253"/>
  </g>
</svg>
