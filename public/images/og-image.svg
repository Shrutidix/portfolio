<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231813"/>
      <stop offset="50%" stop-color="#2B1E18"/>
      <stop offset="100%" stop-color="#1A120E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9C3A3"/>
      <stop offset="100%" stop-color="#7E9387"/>
    </linearGradient>
  </defs>

  <!-- Deep Espresso Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Editorial Margin Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="rgba(217, 195, 163, 0.25)" stroke-width="1.5"/>
  <rect x="52" y="52" width="1096" height="526" rx="14" fill="none" stroke="rgba(217, 195, 163, 0.12)" stroke-width="1"/>

  <!-- Top Editorial Header Strip -->
  <g transform="translate(80, 95)">
    <rect x="0" y="0" width="170" height="32" rx="6" fill="#1E252A" stroke="#323E45" stroke-width="1"/>
    <text x="85" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="middle" letter-spacing="2">ATELIER EDITION</text>
    
    <text x="200" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#D9C3A3" letter-spacing="1.5">LOOKBOOK VOL. 2026 // ISSUE 01</text>
    <text x="1040" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#7E9387" text-anchor="end" letter-spacing="1">DOSSIER // PORTFOLIO</text>
  </g>

  <!-- SD Monogram Emblem -->
  <g transform="translate(80, 165)">
    <rect width="70" height="70" rx="18" fill="#1E252A" stroke="url(#borderGrad)" stroke-width="2.5"/>
    <text x="35" y="46" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FAF6EF" text-anchor="middle">SD</text>
  </g>

  <!-- Main Headline &amp; Role -->
  <g transform="translate(80, 285)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="800" fill="#FAF6EF" letter-spacing="-1">
      Shruti Dixit
    </text>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#7E9387" letter-spacing="3">
      DATA ANALYST &#8226; POWER BI &#8226; ML PRACTITIONER
    </text>
    <text x="0" y="110" font-family="'EB Garamond', Georgia, serif" font-size="26" font-style="italic" fill="#D9C3A3">
      "Turning complex business data into clear, confident decisions."
    </text>
  </g>

  <!-- Core Capability Pills -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#FAF6EF"/>
    <text x="82.5" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1C1512" text-anchor="middle">SQL &amp; PostgreSQL</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="180" height="42" rx="10" fill="#FAF6EF"/>
    <text x="270" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1C1512" text-anchor="middle">Power BI &amp; DAX</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="170" height="42" rx="10" fill="#FAF6EF"/>
    <text x="460" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1C1512" text-anchor="middle">Python &amp; ML</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="180" height="42" rx="10" fill="#FAF6EF"/>
    <text x="650" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1C1512" text-anchor="middle">SHAP Explainability</text>

    <!-- Pill 5 -->
    <rect x="755" y="0" width="175" height="42" rx="10" fill="#FAF6EF"/>
    <text x="842.5" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1C1512" text-anchor="middle">Star Schema ETL</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7E9387" font-weight="600">
      NASSCOM GOLD &#8226; AWS ACADEMY GRADUATE &#8226; IBM CREDENTIAL
    </text>
    <text x="1040" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D9C3A3" font-weight="600" text-anchor="end">
      shrutidixit9125@gmail.com
    </text>
  </g>
</svg>
