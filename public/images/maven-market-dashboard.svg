<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="pbiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2227" />
      <stop offset="100%" stop-color="#12171A" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pbiCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242E35" />
      <stop offset="100%" stop-color="#1B2328" />
    </linearGradient>
    <linearGradient id="trendFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 176, 32, 0.35)" />
      <stop offset="100%" stop-color="rgba(255, 176, 32, 0.0)" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="900" height="560" rx="14" fill="url(#pbiBg)" stroke="#323E45" stroke-width="2" />

  <!-- Power BI Titlebar -->
  <rect x="0" y="0" width="900" height="42" rx="14" fill="#14191D" />
  <rect x="0" y="32" width="900" height="10" fill="#14191D" />
  <line x1="0" y1="42" x2="900" y2="42" stroke="#2B363C" stroke-width="1.5" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5" fill="#EF4444" />
  <circle cx="42" cy="21" r="5" fill="#F59E0B" />
  <circle cx="60" cy="21" r="5" fill="#10B981" />

  <!-- Power BI Title &amp; Star Schema Label -->
  <rect x="90" y="9" width="360" height="24" rx="6" fill="#1F272C" stroke="#2B363C" />
  <text x="105" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFB020">Power BI Desktop // Maven Market Retail Model</text>

  <rect x="730" y="9" width="145" height="24" rx="6" fill="#2E2314" stroke="#854D0E" stroke-width="1" />
  <text x="802" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FDE68A" text-anchor="middle">STAR SCHEMA ETL</text>

  <!-- Dashboard Headline -->
  <g transform="translate(30, 60)">
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#FAF6EF">Maven Market Executive Sales &amp; Retail Intelligence</text>
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#A1B3A9">Multi-National Supermarket Chain Analytics &#8226; Relational Modeling &#8226; Interactive DAX KPIs</text>
  </g>

  <!-- Left Slicer / Filter Pane -->
  <g transform="translate(30, 125)">
    <rect x="0" y="0" width="190" height="360" rx="10" fill="url(#pbiCard)" stroke="#323E45" stroke-width="1.5" />
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFB020" letter-spacing="1">SLICERS &#8226; FILTERS</text>
    <line x1="16" y1="38" x2="174" y2="38" stroke="#323E45" stroke-width="1" />

    <!-- Filter 1: Region -->
    <text x="16" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#9CA3AF">Store Region</text>
    <rect x="16" y="68" width="158" height="28" rx="6" fill="#151C20" stroke="#FFB020" stroke-width="1" />
    <text x="26" y="86" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">&#8226; All Global Markets</text>

    <!-- Filter 2: Store Type -->
    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="10" fill="#9CA3AF">Store Format</text>
    <rect x="16" y="126" width="158" height="28" rx="6" fill="#151C20" stroke="#323E45" stroke-width="1" />
    <text x="26" y="144" font-family="'Inter', sans-serif" font-size="11" fill="#D1D5DB">Supermarket &amp; Gourmet</text>

    <!-- Filter 3: Fiscal Year -->
    <text x="16" y="176" font-family="'Inter', sans-serif" font-size="10" fill="#9CA3AF">Calendar Year</text>
    <rect x="16" y="184" width="158" height="28" rx="6" fill="#151C20" stroke="#323E45" stroke-width="1" />
    <text x="26" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#D1D5DB">YTD Performance</text>

    <!-- Model Spec Pill -->
    <rect x="16" y="240" width="158" height="96" rx="8" fill="#151C20" stroke="#323E45" />
    <text x="26" y="260" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#22D3EE">DIMENSIONAL STAR:</text>
    <text x="26" y="278" font-family="'Inter', sans-serif" font-size="9" fill="#9CA3AF">&#8226; Fact_Transactions</text>
    <text x="26" y="294" font-family="'Inter', sans-serif" font-size="9" fill="#9CA3AF">&#8226; Dim_Customers</text>
    <text x="26" y="310" font-family="'Inter', sans-serif" font-size="9" fill="#9CA3AF">&#8226; Dim_Products</text>
    <text x="26" y="326" font-family="'Inter', sans-serif" font-size="9" fill="#9CA3AF">&#8226; Dim_Stores</text>
  </g>

  <!-- 3 Top KPI Cards (No numbers, just "—") -->
  <g transform="translate(235, 125)">
    <!-- KPI 1: Total Sales -->
    <rect x="0" y="0" width="200" height="85" rx="10" fill="url(#pbiCard)" stroke="#323E45" stroke-width="1.5" />
    <text x="18" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#9CA3AF">Total Sales</text>
    <text x="18" y="56" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#FFB020">—</text>
    <text x="18" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E9387">DAX: SUM(Sales[Revenue])</text>

    <!-- KPI 2: Total Profit Margin -->
    <rect x="215" y="0" width="200" height="85" rx="10" fill="url(#pbiCard)" stroke="#323E45" stroke-width="1.5" />
    <text x="233" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#9CA3AF">Total Profit Margin</text>
    <text x="233" y="56" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#22D3EE">—</text>
    <text x="233" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E9387">DAX: DIVIDE(Profit, Sales)</text>

    <!-- KPI 3: Inventory Shelf Life -->
    <rect x="430" y="0" width="205" height="85" rx="10" fill="url(#pbiCard)" stroke="#323E45" stroke-width="1.5" />
    <text x="448" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#9CA3AF">Inventory Shelf Life</text>
    <text x="448" y="56" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#C4B5FD">—</text>
    <text x="448" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E9387">Turnover Efficiency Metric</text>
  </g>

  <!-- Center Main Chart: Monthly Sales Trend Line with Area Gradient -->
  <g transform="translate(235, 225)">
    <rect x="0" y="0" width="380" height="260" rx="10" fill="url(#pbiCard)" stroke="#323E45" stroke-width="1.5" />
    <text x="18" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FAF6EF">Revenue &amp; Profit Growth Trend</text>
    <text x="18" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E9387">Continuous Time Intelligence Evaluation</text>

    <!-- Grid lines -->
    <line x1="25" y1="70" x2="355" y2="70" stroke="#2B363C" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="25" y1="120" x2="355" y2="120" stroke="#2B363C" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="25" y1="170" x2="355" y2="170" stroke="#2B363C" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="25" y1="220" x2="355" y2="220" stroke="#2B363C" stroke-width="1" />

    <!-- Area Gradient Fill -->
    <path d="M 30,190 Q 75,170 120,150 T 210,120 T 300,85 T 350,60 L 350,220 L 30,220 Z" fill="url(#trendFill)" />

    <!-- Amber Trend Line -->
    <path d="M 30,190 Q 75,170 120,150 T 210,120 T 300,85 T 350,60" fill="none" stroke="#FFB020" stroke-width="3" stroke-linecap="round" />
    <circle cx="350" cy="60" r="4.5" fill="#FFB020" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Months Axis -->
    <text x="30" y="238" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E9387">Q1</text>
    <text x="120" y="238" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E9387">Q2</text>
    <text x="210" y="238" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E9387">Q3</text>
    <text x="300" y="238" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E9387">Q4</text>
    <text x="350" y="238" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#FFB020">YTD</text>
  </g>

  <!-- Right Chart: Star Schema Decomposition Tree Breakdown -->
  <g transform="translate(630, 225)">
    <rect x="0" y="0" width="240" height="260" rx="10" fill="url(#pbiCard)" stroke="#323E45" stroke-width="1.5" />
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FAF6EF">Decomposition Tree</text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22D3EE">AI Root-Cause Drill Down</text>

    <!-- Root Node -->
    <rect x="16" y="60" width="90" height="38" rx="6" fill="#151C20" stroke="#FFB020" stroke-width="1.5" />
    <text x="24" y="76" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#FAF6EF">Total Profit</text>
    <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFB020">High Variance</text>

    <!-- Branch Lines -->
    <line x1="106" y1="79" x2="135" y2="79" stroke="#FFB020" stroke-width="1.5" />
    <line x1="135" y1="79" x2="135" y2="140" stroke="#FFB020" stroke-width="1.5" />
    <line x1="135" y1="140" x2="150" y2="140" stroke="#FFB020" stroke-width="1.5" />
    <line x1="135" y1="79" x2="150" y2="79" stroke="#FFB020" stroke-width="1.5" />

    <!-- Branch Node 1: Produce -->
    <rect x="150" y="60" width="76" height="36" rx="6" fill="#151C20" stroke="#323E45" />
    <text x="158" y="75" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#FAF6EF">Produce</text>
    <text x="158" y="88" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#10B981">+Top Driver</text>

    <!-- Branch Node 2: Meat &amp; Seafood -->
    <rect x="150" y="122" width="76" height="36" rx="6" fill="#151C20" stroke="#323E45" />
    <text x="158" y="137" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#FAF6EF">Packaged</text>
    <text x="158" y="150" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#22D3EE">Stable Margin</text>

    <!-- Bottom Metric -->
    <rect x="16" y="180" width="208" height="65" rx="6" fill="#151C20" stroke="#323E45" />
    <text x="24" y="200" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#7E9387">DAX PERFORMANCE:</text>
    <text x="24" y="218" font-family="'Inter', sans-serif" font-size="8" fill="#D1D5DB">&#8226; VertiPaq In-Memory Engine</text>
    <text x="24" y="234" font-family="'Inter', sans-serif" font-size="8" fill="#D1D5DB">&#8226; Star Schema Zero-Looping</text>
  </g>

  <!-- Bottom Global Status -->
  <line x1="30" y1="510" x2="870" y2="510" stroke="#2B363C" stroke-width="1" />
  <text x="30" y="534" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E9387">POWER BI &#8226; DAX &#8226; POWER QUERY ETL &#8226; STAR SCHEMA &#8226; VERIFIED METRICS</text>
  <text x="870" y="534" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFB020" text-anchor="end">SHRUTI DIXIT // LOOKBOOK ARCHIVE</text>
</svg>
