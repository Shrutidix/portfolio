<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="stemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="stemDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B282A" />
      <stop offset="100%" stop-color="#121C1D" />
    </linearGradient>
  </defs>

  <!-- Outer Seal Circle -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#stemGold)" stroke-width="4" stroke-dasharray="3,3" />
  <circle cx="100" cy="100" r="86" fill="url(#stemDark)" stroke="url(#stemGold)" stroke-width="2.5" />

  <!-- STEM Atom / Orbital Graphic -->
  <g transform="translate(100, 95)" stroke="#7E9387" fill="none" stroke-width="1.8">
    <ellipse cx="0" cy="0" rx="26" ry="9" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="26" ry="9" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="26" ry="9" transform="rotate(90)" />
    <circle cx="0" cy="0" r="4.5" fill="url(#stemGold)" stroke="none" />
    <circle cx="18" cy="8" r="2.5" fill="#22D3EE" stroke="none" />
    <circle cx="-16" cy="10" r="2.5" fill="#FFE082" stroke="none" />
  </g>

  <!-- Header -->
  <text x="100" y="44" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="url(#stemGold)" text-anchor="middle" letter-spacing="1">NASSCOM</text>
  <text x="100" y="55" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="7.5" fill="#EFE6DA" text-anchor="middle" letter-spacing="0.5">FUTURESKILLS PRIME</text>

  <!-- Banner -->
  <rect x="36" y="132" width="128" height="17" rx="3" fill="url(#stemGold)" />
  <text x="100" y="144" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#121C1D" text-anchor="middle" letter-spacing="0.8">DIGITAL APPLICATION</text>
  <text x="100" y="162" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="7.5" fill="url(#stemGold)" text-anchor="middle">STEM &#8226; GOLD CATEGORY</text>
  <text x="100" y="174" font-family="'Inter', sans-serif" font-weight="600" font-size="6" fill="#A1B3A9" text-anchor="middle">IT-ITES SSC CERTIFIED</text>
</svg>
