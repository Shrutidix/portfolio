<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="awsGenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="awsDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232F3E" />
      <stop offset="100%" stop-color="#141E28" />
    </linearGradient>
    <filter id="genaiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C5CFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- AWS Hexagon / Shield Shape -->
  <path d="M 100,10 L 175,52 L 175,142 L 100,186 L 25,142 L 25,52 Z" fill="url(#awsDark)" stroke="url(#awsGenGrad)" stroke-width="3" filter="url(#genaiGlow)" />
  <path d="M 100,18 L 167,56 L 167,137 L 100,177 L 33,137 L 33,56 Z" fill="none" stroke="rgba(124, 92, 255, 0.3)" stroke-width="1.5" />

  <!-- AWS Smile Arc -->
  <path d="M 68,68 Q 100,85 132,68" fill="none" stroke="#FF9900" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 127,62 L 134,68 L 126,73 Z" fill="#FF9900" />

  <!-- GenAI Spark / Neural Transformer Icon -->
  <g transform="translate(100, 104)">
    <!-- Central Spark -->
    <path d="M 0,-18 L 4,-5 L 17,0 L 4,5 L 0,18 L -4,5 L -17,0 L -4,-5 Z" fill="#22D3EE" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <!-- Secondary Sparks -->
    <path d="M -16,-10 L -14,-3 L -7,0 L -14,3 L -16,10 L -18,3 L -25,0 L -18,-3 Z" fill="#7C5CFF" transform="scale(0.6)" />
    <path d="M 16,-10 L 14,-3 L 7,0 L 14,3 L 16,10 L 18,3 L 25,0 L 18,-3 Z" fill="#FF9900" transform="scale(0.6)" />
  </g>

  <!-- AWS Academy Header Text -->
  <text x="100" y="44" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AWS ACADEMY</text>
  <text x="100" y="55" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" fill="#22D3EE" text-anchor="middle" letter-spacing="1">GRADUATE</text>

  <!-- Badge Name Ribbon -->
  <rect x="40" y="142" width="120" height="17" rx="3" fill="url(#awsGenGrad)" />
  <text x="100" y="154" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#141E28" text-anchor="middle" letter-spacing="0.5">GENERATIVE AI</text>
  <text x="100" y="172" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="6.5" fill="#D9C3A3" text-anchor="middle">FOUNDATIONS</text>
</svg>
