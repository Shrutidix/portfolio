<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#E07A00" />
    </linearGradient>
    <linearGradient id="awsDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232F3E" />
      <stop offset="100%" stop-color="#141E28" />
    </linearGradient>
    <filter id="awsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- AWS Badge Hexagon / Shield Shape -->
  <path d="M 100,10 L 175,52 L 175,142 L 100,186 L 25,142 L 25,52 Z" fill="url(#awsDark)" stroke="url(#awsOrange)" stroke-width="3" filter="url(#awsShadow)" />
  <path d="M 100,18 L 167,56 L 167,137 L 100,177 L 33,137 L 33,56 Z" fill="none" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1.5" />

  <!-- AWS Smile Arc -->
  <path d="M 68,68 Q 100,85 132,68" fill="none" stroke="url(#awsOrange)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 127,62 L 134,68 L 126,73 Z" fill="url(#awsOrange)" />

  <!-- Machine Learning Nodes Icon -->
  <g transform="translate(100, 102)" fill="#22D3EE" stroke="#232F3E" stroke-width="1.5">
    <circle cx="0" cy="-14" r="5" fill="#FF9900" />
    <circle cx="-16" cy="6" r="4.5" fill="#22D3EE" />
    <circle cx="16" cy="6" r="4.5" fill="#22D3EE" />
    <circle cx="0" cy="18" r="5" fill="#7C5CFF" />
    <!-- Connector Lines -->
    <line x1="0" y1="-14" x2="-16" y2="6" stroke="#FF9900" stroke-width="1.5" />
    <line x1="0" y1="-14" x2="16" y2="6" stroke="#FF9900" stroke-width="1.5" />
    <line x1="-16" y1="6" x2="0" y2="18" stroke="#22D3EE" stroke-width="1.5" />
    <line x1="16" y1="6" x2="0" y2="18" stroke="#22D3EE" stroke-width="1.5" />
  </g>

  <!-- AWS Academy Header Text -->
  <text x="100" y="44" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AWS ACADEMY</text>
  <text x="100" y="55" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" fill="url(#awsOrange)" text-anchor="middle" letter-spacing="1">GRADUATE</text>

  <!-- Badge Name Ribbon -->
  <rect x="40" y="142" width="120" height="17" rx="3" fill="url(#awsOrange)" />
  <text x="100" y="154" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#141E28" text-anchor="middle" letter-spacing="0.5">MACHINE LEARNING</text>
  <text x="100" y="172" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="6.5" fill="#D9C3A3" text-anchor="middle">FOUNDATIONS</text>
</svg>
