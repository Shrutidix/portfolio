<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%" height="60" fill="none">
  <!-- Subtle baseline -->
  <line x1="20" y1="50" x2="580" y2="50" stroke="#7E9387" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  
  <!-- Hand-drawn style bar chart columns -->
  <g stroke="#7E9387" stroke-width="1.5" stroke-linecap="round">
    <line x1="60" y1="50" x2="60" y2="35"/>
    <line x1="90" y1="50" x2="90" y2="25"/>
    <line x1="120" y1="50" x2="120" y2="40"/>
    <line x1="150" y1="50" x2="150" y2="15"/>
    <line x1="180" y1="50" x2="180" y2="28"/>
    <line x1="210" y1="50" x2="210" y2="10"/>
    
    <!-- Central marker -->
    <circle cx="300" cy="50" r="4" fill="#3F6253" stroke="#FAF6EF" stroke-width="1.5"/>
    
    <line x1="390" y1="50" x2="390" y2="18"/>
    <line x1="420" y1="50" x2="420" y2="30"/>
    <line x1="450" y1="50" x2="450" y2="12"/>
    <line x1="480" y1="50" x2="480" y2="38"/>
    <line x1="510" y1="50" x2="510" y2="22"/>
    <line x1="540" y1="50" x2="540" y2="42"/>
  </g>

  <!-- Flowing interpolation wave connecting bar tops -->
  <path d="M 60 35 Q 105 10 150 15 T 210 10 Q 255 35 300 50 Q 345 35 390 18 T 450 12 Q 495 25 540 42" 
        stroke="#D9C3A3" stroke-width="1.2" stroke-dasharray="2 3" fill="none"/>
</svg>
